[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pushsontakke", email = "pusontakke1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "django>=5.2,<6",
    "django-auditlog>=3.4.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.6.2",
    "django-ninja-jwt>=5.4.5",
    "django-ratelimit>=4.1.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.3",
]
